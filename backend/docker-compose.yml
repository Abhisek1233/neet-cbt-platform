version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: neet_cbt_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: neet_cbt_postgres
    environment:
      POSTGRES_DB: neet_cbt_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  redis_data:
  pg_data:
